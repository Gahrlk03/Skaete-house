<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Login - Skate House</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h2> Skate House</h2>

    <nav>

        <a href="index.html">Início</a>

        <a href="login.html">Login</a>

        <div class="menu">

            <a href="#" id="botaoSobre">Sobre</a>

            <div class="submenu" id="submenuSobre">
                <a href="#">Empresa</a>
                <a href="#">Clientes</a>
            </div>

        </div>

        <div class="menu">

            <a href="#" id="botaoContato">Contato</a>

            <div class="submenu" id="submenuContato">
                <a href="#">Telefones</a>
                <a href="#">Email</a>
            </div>

        </div>

    </nav>

</header>


<main>

    <h1>Login</h1>

    <p>Entre na sua conta da Skate House.</p>

    <form id="formLogin">

        <label for="emailLogin">Gmail:</label>

        <input
            type="email"
            id="emailLogin"
            placeholder="Digite seu Gmail"
            required
        >

        <label for="senhaLogin">Senha:</label>

        <input
            type="password"
            id="senhaLogin"
            placeholder="Digite sua senha"
            required
        >

        <button type="submit" class="botao">
            Entrar
        </button>

    </form>

    <p>Ainda não possui cadastro?</p>

    <a href="cadastro.html" class="botao">
        Cadastre-se
    </a>

</main>


<footer>

    <p>
        Todos os direitos reservados.
        Gabriel Melo e Milena.
    </p>

</footer>


<script src="script.js"></script>

</body>
</html>
